name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify Formatting
        run: |
          test -z "$(gofmt -l .)" || (echo "Files need formatting:" && gofmt -l . && exit 1)

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -v -race -count=1 ./...

      - name: Build Binaries
        run: |
          go build -v -o bin/aegis ./cmd/aegis
          go build -v -o bin/mockupstream ./cmd/mockupstream
          go build -v -o bin/benchmark ./cmd/benchmark

      - name: Build Docker Image
        run: docker build -t aegisllm:ci .
